name: Agents Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - agents

permissions:
  id-token: write
  contents: read

env:
  AZURE_ENV_NAME: AI_Foundry
  AZURE_LOCATION: eastus2 # Change to your target Azure region

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install AI Agents Extensions
        run: azd extension install azure.ai.agents

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to azd
        run: azd auth login --client-id ${{ secrets.AZURE_CLIENT_ID }} --tenant-id ${{ secrets.AZURE_TENANT_ID }} --federated-credential-provider github

      - name: Provisioning
        run: azd provision --no-prompt

      - name: Deploy agent
        run: azd deploy --no-prompt
