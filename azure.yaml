# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: agent-framework-agent-basic-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  azure-insights:
    host: azure.insights
    deployments:
      - name: azure-insights-deployment
        sku:
          name: GlobalStandard
          capacity: 10
  agent-framework-agent-basic-responses:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Streaming
        - Monitoring
    project: src/agent-framework-agent-basic-responses
    language: python
    uses:
      - ai-project
      - azure-insights # Links the insights resource
    kind: hosted
    name: agent-framework-agent-basic-responses
    description: A basic Agent Framework agent hosted by Foundry with monitoring enabled.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      # APPLICATIONINSIGHTS_CONNECTION_STRING is automatically injected by the platform because azure-insights is in 'uses'
    container:
      resources:
        cpu: '0.5'
        memory: 1.0Gi
    docker:
      path: Dockerfile
infra:
  provider: microsoft.foundry
